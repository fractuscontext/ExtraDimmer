name: Compile and Publish on GitHub Release

on:
  push:
    branches: [main]
    paths-ignore: [".github/workflows/**", "README.md"]
  pull_request:
    branches: [main]
    paths-ignore: [".github/workflows/**", "README.md"]
  workflow_dispatch:
    inputs:
      create-release:
        type: boolean
        description: Publish on GitHub Release

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
      - uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Read Nix-Calculated Version
        id: version
        run: |
          # Use Nix to extract the precise date-format directly from this Git Commit's epoch
          NEW_VERSION="$(nix run .#print-version)"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build DMG Package
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        # Pass the formatted version in so the internal PlistBuddy and DMG_NAME catch it
        run: nix run .#makeDmg

      - name: Rename Package
        run: mv ExtraDimmer-${{ steps.version.outputs.version }}.dmg ExtraDimmer-${{ steps.version.outputs.version }}-aarch64.dmg

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          path: ./

      - name: Create GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create-release == true )
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          files: ExtraDimmer-${{ steps.version.outputs.version }}-aarch64.dmg
          generate_release_notes: true
